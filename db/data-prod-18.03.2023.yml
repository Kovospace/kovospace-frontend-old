    - istatDB
    - 'Know-how databáza a management pre spracovávanie tovarovej štiatistiky a colnej
      deklarácie. '
    - <div>Aplikácia bola navrhnutá ako databáza znalostí a menežment/organizér činností
      pre administratívneho pracovníka pripravujúceho podklady pre vypracovanie tovarovej
      štatistiky Intrastat (štatistika ktorú vykazujú firmy s vyšším obratom o pohybe
      tovaru po Európskej únií) a colnú deklaráciu.<br><br>Fundamentálnym základom
      aplikácie je zoznam tovarov, kde tovar je vždy priradený k určitému číslu, ktoré
      ho charakterizuje v colnom sadzobníku. Okrem toho aplikácia zhromažďuje ďalšie
      množstvo doplňujúcich údajov o tovare, výrobcoch, odberateľoch, spravodajských
      jednotkách (= firma, ktorá si objedná zastupovanie vo veci odovzdania tovarovej
      štatistiky alebo colej deklarácie), vzťahoch medzi nimi a tokoch.<br><br>Jednotlivé
      komponenty aplikácie sú navrhnuté za účelom zrýchlenia a zefektívnenia pracovného
      procesu, odbremenenia ľudského článku od mechanickej a pre človeka časovo náročnej
      a zbytočnej monotónnej ubíjajúcej práce. <br><br>Aplikácia je navrhnutá pre
      chod na vnútropodnikovej počítačovej sieti (LAN), obsahuje používateľské účty
      s rôznymi právami, je možné nastaviť pravidelné automatické zálohy (FTP), exportovanie
      zvolených údajov podľa zvolených kritérií napríklad priamo do tabuľky Microsoft
      Excel.<br><br>* <em>Ukážkové dáta v aplikácií sú vymyslené a nie je ich mnoho.
      Prácu s reálnymi dátami v tejto aplikácií nie je možné ukázať, lebo tieto dáta
      sú obchodným tajomstvom a firemným know-how a sú často poskytované subjektmi,
      ktoré od firmy odoberajú predmetné služby, teda podliehajú aj smernici GDPR.</em><br><br>Hlavnou
      funkciou celého rozhrania je inteligentné fulltextové vyhľadávanie položky v
      databáze - používateľ zadáva kľúčové slovo a medzičasom aplikácia už zobrazuje
      a zvýrazňuje výsledky v intelignetnom režime, napríklad pri prehľadávaní tovarov
      sú najskôr zobrazené položky, kde výsledkom hľadania vyhovuje referencia a začínajú
      sa hľadaným výrazom, potom ostatné, kde vyhľadávaný reťazec obsahuje referencia
      a ako posledné tie, pri ktorých sa hľadaný výraz nachádza v popise tovaru a
      doplnkových informáciách.<br><br>&lt;#obrazok24#&gt;<br><br>Na vyhľadávanie
      je možné okrem samotného hľadaného výrazu aplikovať ešte rôzne filtre a kritériá.<br>V
      prípade, že nie je položka nájdená, je ponúknuté užívateľovi ju ihneď pridať
      s tým, že známe polia (pole vyhľadávača a ak sú napríklad aplikované nejaké
      filtre hľadania) bude formulár predvyplnený.&nbsp;<br><br>&lt;#obrazok25#&gt;&lt;#obrazok26#&gt;&lt;#obrazok27#&gt;<br><br>Možnosť
      vyhľadávania je používaná naprieč celou aplikáciou, aj vo formulároch. Vyhľadávanie
      aj vo formulároch vždy začína automaticky po dosiahnutí určitého času po tom,
      ako používateľ prestal zadávať vstup.<br>V prípade, že daná možnosť nie je vo
      formulári pri pridávaní/editácií položky nájdená, ponúkne aplikácia túto položku
      na pridanie ako novú.<br><br>&lt;#obrazok30#&gt;&lt;#obrazok31#&gt;<br><br>Aplikácia
      je delená do sekcií - kariet podľa zamerania. Prvá karta ale prehľadáva na hľadaný
      výraz všetky sekcie naraz.<br><br>&lt;#obrazok28#&gt;&lt;#obrazok29#&gt;<br><br>Grafické
      prostredie aplikácie okrem toho, že všetky údaje a položky sú vzájomne prelinkované
      obsahuje aj drobné ikonky, ktoré po nabehnutí myšou nad môžu zobrazovať doplnkové
      informácie ktoré často šetria nutnosť otvoriť celú prelinkovanú položku.<br>Po
      otvorení položky sa ale zobrazia všetky vyčerpávajúce informácie, ktoré sú s
      touto položkou zviazané.&nbsp;<br>K niektorým, hlavne číselným údajom je k dispozícií
      modul kalkulačky, ktorá má pri prechádzaní položkami pamäť až pokiaľ nie je
      explicitne vymazaná a je na nej možné zrátavať naraz viacero druhov veličín.<br><br>&lt;#obrazok17#&gt;&lt;#obrazok11#&gt;&lt;#obrazok12#&gt;&lt;#obrazok13#&gt;&lt;#obrazok14#&gt;&lt;#obrazok15#&gt;<br><br>Ak
      boli ku položke priradené aj nejaké obrázky, je možné ich v plnej veľkosti/väčšie
      zobrazovať pomocou galérie.<br><br>&lt;#obrazok16#&gt;<br><br>Pri stavbe aplikácie
      nebolo o nej rozmýšlané len ako o nástroji na uchovávanie údajov, ale aj ako
      nástroji, ktorý organizuje pracovný proces. Aplikácia napríklad umožňuje uloženie
      položky a priradenie stavu, o ktorej treba pre zaradenie zistiť ešte dodatočné
      údaje (od niektorého subjektu) a jej priradenie ku konkrétnej zodpovednej osobe,
      pracovnej úlohe alebo časovému obdobiu.<br>Tieto položky je potom možné podľa
      rôznych filtrov alebo osobitnej sekcie dohľadať a napríklad exportovať do Excel
      tabuľky, ktorú je možné odoslať subjektu ako dopyt na poskytnutie potrebných
      údajov.<br><br>&lt;#obrazok32#&gt;&lt;#obrazok33#&gt;&lt;#obrazok34#&gt;<br><br>Tu
      sú sporné položky vo vlastnej sekcii, radené k obdobiu/pracovnej úlohe. K pracovným
      úlohám je možné nahrávať dodatočné súbory a sledovať bilanciu vyriešených/zostávajúcich
      prípadov.<br><br>&lt;#obrazok35#&gt;&lt;#obrazok36#&gt;&lt;#obrazok37#&gt;<br><br>Samozrejmosťou
      je aj jednoduchý modul na zápis poznámok a zadávanie úloh, a zoznam zmien. Osobne
      som ho skôr využíval na zápis nápadov/úloh čo treba na aplikácií opraviť/vylepšíť/pridať.<br><br>&lt;#obrazok22#&gt;&lt;#obrazok23#&gt;<br><br>Obsah
      každej sekcie je samozrejme možné spravovať. Buď tak možno spraviť po zobrazení
      položky alebo je možné prepnúť vyhľadávač do "administratívneho" režimu, kedy
      budú zobrazované tlačidlá pre jednotlivé operácie na konci riadka.<br><br>&lt;#obrazok38#&gt;&lt;#obrazok39#&gt;<br><br>Aplikácia
      je prispôsobená aj na zobrazenie na obmedzenej ploche (responzívny design),
      nejedná sa ale primárne o prípad využitia na mobilných zariadeniach, tento prípad
      je z praktického hľadiska veľmi málo pravdepodobný, jedná sa skôr o prípad,
      keď sa aplikácia nachádza na obrazovke počítača spolu s oknami iných aplikácí,
      popri ktorých je súbežne využívaná.&nbsp;<br><br>&lt;#obrazok45#&gt;&lt;#obrazok46#&gt;&lt;#obrazok47#&gt;&lt;#obrazok48#&gt;&lt;#obrazok49#&gt;<br><br>Používateľské
      účty, základné nastavenia, sekcie na úpravu rôznych atribútov.<br><br>&lt;#obrazok1#&gt;&lt;#obrazok2#&gt;&lt;#obrazok3#&gt;&lt;#obrazok40#&gt;&lt;#obrazok41#&gt;&lt;#obrazok42#&gt;&lt;#obrazok43#&gt;&lt;#obrazok44#&gt;<br><br></div>
