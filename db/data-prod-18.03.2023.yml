    - Emerald unmaximize fix
    - 'Monkeypatch problému v grafickom prostredí systémov Linux '
    - <div>Jedná sa o démon napísaný v jazyku C a beží na pozadí po sustení systému.&nbsp;<br><br>Linux
      už viaceré roky trpí zvláštnym problémom, kedy súbežné používanie efektov Compiz
      Fusion a dekorátora okien Emerald pri použití hacku, ktorý odstráni dekorácie
      okien (t.j. titulok - pás s názvom okna a tlačidlami ako maximalizovať, minimalizovať,
      zavrieť) na maximalizovaných oknách a tieto sú potom ovládané tlačidlami (applet)
      XFCE alebo Gnome (Mate) panela.&nbsp;<br><br>Pri návrate z maximalizácie do
      pôvodného stavu sa však dekorácie okna niekedy neobnovia. Dekorácie sa však
      záhadne vrátia, ak sa oknu nastaví nejaký príznak alebo zmení text - názov okna
      (napríklad v okne programu na IM - príde nová správa)<br><br>Tento fakt bol
      dostačujúci na zhotovenie tohoto programu, jeho princíp je v podstate v tom,
      že keď nejaké okno zaznamená zmenu stavu z maximalizovaného na iný, je k názvu
      okna pridaná medzera alebo odstránená, ak bola na koniec názvu pridaná predtým,
      čím sa zabezepčí to, že sa "niečo v systéme pohne" a dekorácie sa vykreslia.<br><br></div>
