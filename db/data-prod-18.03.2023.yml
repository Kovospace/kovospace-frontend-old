  records: 
  - - 1
    - Spustený web
    - Spustený web, treba ešte preveriť 100% funkčnosť blogu (komentáre, sekcie, seriály,
      používatelia, hodnotenia, správa obsahu...), zatiaľ nemám obsah ani čas pre
      túto sekciu, zatiaľ pozastavené.
    - '2020-05-20 19:18:03.332049'
    - '2020-05-20 19:18:03.332049'
  - - 2
    - React, Angular, Vue
    - "Dal som sa na kurz React.js, Angular a Vue od learn2code.sk.\r\nVau, doteraz
      som žil v jaskyni! Už po \"hello world\" príklade nechcem jQuery ani vidieť!\r\nĎalšia
      stránka bude bežať na jednom z nich!  "
    - '2020-05-29 01:25:32.902791'
    - '2020-05-29 01:43:19.320340'
  - - 3
    - Človek sa učí celý život
    - "Obzvlášť programovanie, hádam neexistuje na svete kód, ktorý by sa nedal napísať
      lepšie a vždy sa bude dať naučiť sa niečo nové.\r\nOd 19.11.2020 hrdým študentom
      GreenFoxAcademy.cz"
    - '2020-11-22 00:34:52.710785'
    - '2021-10-28 23:32:23.121100'
  - - 4
    - Kurz úspešne dokončený
    - "3 moduly a 42 týždňov bootcampu na GreenFox academy je úspešne za mnou.\r\n\r\nNaša
      skupina si na tretí modul zvolila orientáciu na backend a úlohou nášho 6-členného
      týmu bolo vyvinúť REST API pre strategickú hru na štýl hier ako Travian alebo
      Age of empires. Tento cieľ sa nám podarilo s množstvom implementovaných funkcií
      ešte aj mierne prekročiť a vedomosti hlavne čo sa týka DevOps a simulovania
      reálnej práce v tíme nám všetkým umožnili plynule naskočiť do robôt.\r\n\r\nOproti
      skostnateným štátnym vzdelávacím inštitúciám toto pokladám pre väčšinu ľudí,
      ktorí sa nejdú ďalej uberať akademickou/vedeckou cestou za budúcnosť vzdelávania
      a náhradu za tento nefunkčný systém páchnuci niekde ešte stredovekom, nieto
      totalitou.\r\n\r\nNa tomto kurze by som ocenil fair-play biznis model, ktorý
      mi akosi dal istotu že sa nejedná o scam, vonkoncom online kurzov ktoré \"dačo
      naučia\" a za ktoré treba zacvakať je dnes na nete za dve tatrovky. V ich biznis
      modeli môžete začať splácať kurz až po jeho absolvovaní a až potom ako sa Vám
      vďaka ich pomoci podarí nájsť prácu.\r\n\r\nToto je na dlhší monológ na ktorý
      táto sekcia nebola stavaná - o tomto počine by som možno aj niekedy napísal
      blog /alebo rovno celý seriál/ (ak bude niekedy v živote na tomto webe blok
      odladený a hotový) pre ľudí, ktorí by uvažovali nad podobnou zmenou svojho odboru/kariéry."
    - '2021-09-21 00:00:00.000000'
    - '2021-10-28 23:30:52.317785'
  - - 5
    - Hurá mám robotu :D
    - "Prvý týždeň v prvej robote v odbore a prvej v živote kde nejdem len kvôli peniazom
      je za mnou :D\r\nMalá spoločnosť ale s dlhou tradíciou, pracujúca na svojom
      vlastnom produkte v oblasti leteckého priemyslu a cestovného ruchu, malý a stabilný
      kolektív, \"startup\" to proste znie cool, aj keď zaužívaný obraz o korporáciách
      ako hnacom motore dystopickej spoločnosti budúcnosti sa vo veľa prípadoch nemusí
      ani približovať tejto predstave, hlavne v odvetviach a dobe ktorá sa začína
      čoraz viac riadiť princípmi vzdelanostnej ekonomiky. \r\n\r\nNa druhú stranu
      je to obrovský tlak - snažiť sa nezfailovať všetko čo sa dostane pod ruku, zapracovať
      sa do projektu a vykázať nejaký prínos a udržať sa tu."
    - '2021-10-08 00:00:00.000000'
    - '2022-11-09 21:04:27.750956'

