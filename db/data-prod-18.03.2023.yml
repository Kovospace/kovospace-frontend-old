    - Iná grafická tvorba
    - Iná grafická tvorba, predovšetkým vektorová grafika - aplikácie inkScape, GIMP
    - "<div><strong>Budíky pre motocykel Simson S51</strong><br><br>Jedna z voľnočasových
      aktivít - reštaurácia a jazdenie na starej motorke. <br>Budíky na mojej motorke
      boli už dosť zničené, pôvodný náter na budíkoch bol vyblednutý a po stranách
      vydratý - od tieniaceho krúžka ktorý lemuje zvnútra okraj a mal by aj pomáhať
      pri smerovaní svetla na plochu budíka.<br>Nové budíky však stáli neskutočné
      peniaze a napríklad nový aj druhovýrobný tachometer je takmer nezohnateľný.
      Riešenie bolo teda skúsiť podklad podľa pôvodnej predlohy nakresliť a dať vytlačiť
      na čiernu matnú samolepiacu fóliu. Rozdiel oproti originálu ide poznať až pri
      blízkom pohľade. Sivé miesta boli vyrezané plotrom.<br><br>&lt;#obrazok2#&gt;<br><br><strong>Spodný
      rad kontroliek Škoda Felicia 1.9 D</strong><br><br>Úlohou bolo zjednotiť vzhľad
      horizontálneho a vertikálneho radu kontroliek na prístrojovej doske. Horizontálny
      (spodný) rad kontroliek je vo Felde realizovaný ako tmavé piktogramy vo svietiacich
      obdĺžnikoch, zatiaľ čo vertikálny rad kontroliek je len svietiaci piktogram.<br>Polep
      kúrenia bol realizovaný kvôli vysokej náročnosti nedeštruktívneho odstránenia
      pôvodného polepu a odstránenia zelenej podkladovej farby, ktorá zafarbovala
      svetlo bielych (žltých vláknových) žiaroviek. Pri ciferníkoch budíkov a kontrolkách
      je táto úprava jednoduchá. <br><br> &lt;#obrazok6#&gt;&lt;#obrazok5#&gt;<br><br><strong>Reprezentačná
      grafika pre miestny stolnotenisový klub</strong><br><br>Motív symbolov klubu
      vychádza z mestského erbu.<br><br>&lt;#obrazok7#&gt;&lt;#obrazok8#&gt;<br><br><br><br><br><br><br><br></div>"
