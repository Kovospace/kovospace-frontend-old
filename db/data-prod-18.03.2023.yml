    - Paster.cloud
    - 'Paster.cloud synchronizuje a zálohuje schránku skopírovaného obsahu (clipboard)
      medzi rôznymi zariadeniami. '
    - '<div><strong>Paster.cloud</strong> je projekt zdieľanej schránky s dočasným
      skopírovaným obsahom, tzv. "clipboard" medzi rôznymi zariadeniami a operačnými
      systémami.<br>Clipboard je to, čo pracuje keď používate CTRL + C a CTRL + V
      na počítači alebo proste "kopírovať" a "vložiť", aj na hocijakom inom zariadení,
      napríklad telefóne.<br><br><br>Cieľom tejto aplikácie je:<br><br></div><ul><li>Poskytnúť
      funkčnosť, kedy jednoduchým skopírovaním obsahu na jednom zariadení budeme mať
      tento obsah baz ďalších zbytočných obštrukcií ihneď dostupný aj na svojich ďalších
      spárovaných zariadeniach.&nbsp;<br>Predstavujem si to napríklad takto: Na počítači
      niečo skopírujem pomocou CTRL + C. Zoberem telefón do ruky a použijem "Vložiť".
      Žiadne obštrukcie s prepisovaním niečoho, preposielaním cez mail alebo kopírovaním
      do telefónu cez kábel, posielaním cez bluetooth alebo google cloud, žiadne takéto
      opičky pre jednoduchú triviálnu úlohu.</li></ul><div><br></div><ul><li>Ďalšia
      funkčnosť, ktorú by mala aplikácia poskytovať je história a záloha. Obvykle
      akonáhle nahráme do schránky nový obsah, o starý prídeme. Táto aplikácia si
      však bude vedeiť pamätať minulosť.</li></ul><div><br><br>Momentálne sú stále
      vo vývoji prvé tri časti aplikácie:<br><br></div><ul><li>Backend napísaný v
      Jave a frameworku Spring Boot - toto je jadro aplikácie, akýsi prostredník kde
      sa nachádzajú všetky dáta a hlavná logika.</li></ul><div><br></div><ul><li>Frontend
      napísaný v Angulari - webová stránka/aplikácia na prístup k dátam a správu používateľov
      (zatiaľ obsahuje základnú funkčnosť vytvorenia používateľa/prihlásenia sa)</li></ul><div><br></div><ul><li>Java
      aplikácia pre Androidy</li></ul><div><br><br>Aplikácia je vyvíjaná ako open-source
      projekt, zdrojové kódy možno nájsť na mojom githube:<br><br></div><ul><li>Backend:
      <a href="https://github.com/K0V0/paster-backend">https://github.com/K0V0/paster-backend</a></li></ul><div><br></div><ul><li>Frontend:
      <a href="https://github.com/K0V0/paster-frontend">https://github.com/K0V0/paster-frontend</a></li></ul><div><br></div><ul><li>Android:
      <a href="https://github.com/K0V0/paster-android">https://github.com/K0V0/paster-android</a></li></ul><div><br></div>'
    - https://www.paster.cloud/
