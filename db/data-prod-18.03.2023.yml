  - - 2
    - DeltaX app
    - 'Mobilná aplikácia na štatistické spracovanie výsledkov meraní '
    - <div><strong>DeltaX</strong> je aplikácia určená na štatistické spracovávanie
      výsledkov z laboratórnych meraní, resp. akýchkoľvek meraní, kde je za účelom
      čo najpresnejšieho merania a eliminácie chyby merania daná veličina meraná opakovane.&nbsp;<br><br>Cieľom
      tejto aplikácie je človeka odbremeniť človeka od času konzumujúcej a repetitívnej
      činnosti, ktorá nie je predmetom a cieľom skúmania a pochopenia skúmaného deja,
      ale len nutným procesom, ktorý sám o sebe zvyšuje riziko zanesenia chyby do
      výslednej práce.<br><br>V neposlednom rade je to lenivosť, ktorá bola veľmi
      často v histórií ľudstva motorom pokroku, keď človek za účelom uľahčenia&nbsp;
      niektorých činností hľadá a špekuluje, ako by ich bolo možné zjednodušiť alebo
      úplne eliminovať. Mám za to, že prirodzenosťou človeka a niekedy aj naplnením
      života je objavovať a tvoriť a stereotyp ubíja a tieto činnosti by mali vykonávať
      stroje.<br><br>Trocha odbočenie k filozofickému okienku, funkčnosť aplikácie
      je veľmi jednoduchá:&nbsp;<br><br></div><ul><li>na začiatku je užívateľ opýtaný,
      koľko chce uskutočniť meraní a na násobok, pri ktorom sú dané hodnoty merané
      (napríklad, meria sa hodnota prúdu v miliampéroch, základná jednotka je ale
      ampér, teda je aplikácií potrebné zdeliť, že hodnoty, ktoré sú zadávné sú tisícinou
      základnej jednotky - teda 10^-3)&nbsp;</li></ul><div><br></div><ul><li>potom
      nasleduje samostatné zadávanie hodnôt, aplikácia používateľa nepustí ďalej ak
      zadal napríklad hodnotu, ktorá je chybná (nepovolený znak / vstup nie je číslom)
      prípadne zadbudol niektorú hodnotu zadať</li></ul><div><br></div><ul><li>posledným
      krokom už je samotné vygenerovanie tabuľky a základných údajov, ktoré sú štandartne
      požadované pri uskutočňovaní hádam 99% laboratórnych meraní - teda v kontexte
      a rozsahu štúdia určitého predmetu na škole.&nbsp;<br>Čísla a údaje v tabuľke
      sú prehodnotené a vždy vypísané v "esteticky" čo najlepšom tvare - aby sme nemali
      nekonečne dlhé desatinné číslo alebo miliardu niečoho - a násobok je potom uvedený
      v stĺpci tabuľky.</li></ul><div><br>Pri návrhu aplikácie bolo myslené aj na
      to, akým spôsobom bežné programovacie jazyky spracovávajú a uchovávajú desatinné
      čísla a že primárne nebývajú určené len na uskutočňovanie výpočtov a že spôsob,
      akým "pod kapotou" toto funguje môže byť zdrojom veľkých nepresností alebo aj
      fatálnych chýb algoritmu. Našťastie existujú postupy a nástroje ako tieto nedostatky
      obmedziť alebo eliminovať, táto aplikácia je napríklad celá postavená na triede
      BigDecimal(), ktorá je špeciálne určená na aritmetické operácie s desatinnými
      číslami.&nbsp;<br><br><br>&lt;#obrazok1#&gt;&lt;#obrazok2#&gt;&lt;#obrazok3#&gt;&lt;#obrazok4#&gt;&lt;#obrazok5#&gt;&lt;#obrazok6#&gt;&lt;#obrazok7#&gt;<br><br>Táto
      aplikácia bola vyhotovená aj vo verzii pre desktop pc v jazyku C++ s pomocou
      frameworku QT4, no nie je zďaleka tak odladená a pekná ako android verzia.<br><br>&lt;#obrazok8#&gt;&lt;#obrazok9#&gt;&lt;#obrazok10#&gt;<br><br><br></div><div><br></div>
    - www.deltax.cekuj.net
