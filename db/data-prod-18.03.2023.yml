      Čechách a na Slovensku vznikla, a teda tento portál je využívaný predovšetkým
      fanúšikmi mimo hlavný a komerčný prúd, čo však bolo motiváciou k vytvoreniu
      tejto aplikácie je:<br><br></div><ol><li>Tento web je v svojej nezmenenej podobe
      už hádam odkedy začal existovať v CZ/SK internet - čo by až tak nevadilo - pokiaľ
      niečo funguje, načo do toho zbytočne rýpať - ale web s neresponzívnym dizajnom
      je v roku 2021, kedy už hádam polovica návštev pochádza z mobilných zariadení
      naozaj bolesť.</li><li>Samotná webstránka nerieši situáciu keď budem offline
      - čo aplikácie, napríklad aj spotify umožňujú skladby "poukladať" a púšťať offline.&nbsp;</li><li>Úspora
      dát - pri vyhľadávaní kapiel a púštaní skladieb nie je nutnosť načítavať celú
      web stránku, v najlepších prípadoch kedy je zo servera je stiahnutých len pár
      bajtov/kilobajtov, prípadne ak je sladba púštaná opakovane a bola v minulosti
      už uložená, tak sa prehrá s pamäti zariadenia.</li><li>Zúčastňujem sa kurzu
      - kvázi súkromnej akadémie - kde je hlavným vyučovacím predmetom jazyk Java
      a okrem rôznych cvičení a a cvičných projektov, ktoré nás majú pripraviť na
      juniorské pozície softvérových vývojárov som chcel robiť aj niečo viac "reálne".&nbsp;</li></ol><div><br>&lt;#obrazok2#&gt;&lt;#obrazok3#&gt;&lt;#obrazok4#&gt;&lt;#obrazok6#&gt;&lt;#obrazok7#&gt;&lt;#obrazok5#&gt;<br><br>Je
      ale otázne, či vo vývoji tejto aplikácie budem ďalej pokračovať a nebudem sa
      venovať ďalším nápadom, prípadne len zlepšeniu a "skrášleniu" zdrojového kódu
      s novými vedomosťami.<br><br>Kto má o aplikáciu záujem, môže nájsť na GitHube
      inštalačný balíček (<a href="https://github.com/K0V0/BandzoneAndroidUnofficial/releases/download/0.4-alpha/bandZoneUnofficial-0.4-alpha.apk">https://github.com/K0V0/BandzoneAndroidUnofficial/releases/download/0.4-alpha/bandZoneUnofficial-0.4-alpha.apk</a>)
      a zdrojový kód (<a href="https://github.com/K0V0/BandzoneAndroidUnofficial">https://github.com/K0V0/BandzoneAndroidUnofficial</a>)<br><br>Aplikáciu
      nie je možné nájsť (a ani nebude) na Google Play Store práve kvôli svojej povahe
      ponúkajúcej obsah, ktorý je z hľadiska legislatívy ochrany duševného vlastníctva
      sporný - aj keď reálne si myslím, že komunita a hudobná scéna, ktorá by túto
      aplikáciu predovšetkým používala a pomáhala šíriť by túto iniciatívu ocenila.<br><br></div>
    - github.com/K0V0/BandzoneAndroidUnofficial
