      vlastnej implementácie:<br><br></div><ul><li>zdĺhavé a stresujúce ovládanie
      nástroja poskytovaného Finančnou správou, zbytočne spomaľujúce pracovný proces,
      neintuitívne správanie tohoto nástroja v danom nasadení</li></ul><div><br></div><ul><li>vyhľadávací
      algoritmus zobrazujúci len cieľovú položku bez položiek stromu, ktoré k nej
      viedli</li></ul><div><br></div><ul><li>texty obsahujúce citácie ďalších položiek,
      avšak neobsahujúce odkaz na tieto položky</li></ul><div><br></div><ul><li>pridanie
      funkcií ako napríklad JSON API pre inú aplikáciu na ktorej pracujem a bude potrebovať
