    - BandzoneScraper je aplikácia na získavanie dát z Československého hudobného
      portálu venujúcemu sa hlavne českým a slovenským garážovým a undergroundovým
      kapelám aj sólo hudobníkom a hudobným projektom.
    - '<div>Aplikácia slúži ako prostredník, ktorý na základe požadovaného dotazu
      získava dáta zo stránky - z jej HTML elementov - a prevádza chcené dáta na formát
      JSON.<br><br>Formát JSON je jeden zo štandardizovaných a široko používaných
      formátov na import/export/zdieľanie dát medzi rozličnými platformami a aplikáciami
      napísanými v rozličných programovacích jazykoch.<br>Slúži teda ako API (rozhranie)
      na poskytovanie dát, ktorým tento webový portál nedisponuje.<br><br>Získavanie
      dát by bolo síce možné aj priamym prístupom na web BandZone.cz z koncového zariadenia,
      avšak takéto riešenie zbytočne kladie nároky na objem prenášaných dát a výpočtový
      výkon koncového zariadenia a v neposlednom rade aj na komplexnosť aplikácie
      bežiacej na koncovom zariadení.<br><br>Medzičasom ako je písaný tento príspevok
      už je vo vývoji android aplikácia pre mobilné zariadenia, ktorá má byť <del>alternatívou</del>
      doplnkom k iným aplikáciám so streamovaným hudobným obsahom, ktoré ale obsahujú
      minimum československej a hlavne nekomerčnej undergroundovej scény v štýloch
      ako sú punk-rock, rock, metal. Má to byť niečo ako "československé spotify".<br><br>Každopádne
      rozhranie je verejné a ak má niekto podobný nápad alebo využitie, môže z neho
      čerpať, prípadne ho rozbehnúť na vlastnej platforme/serveri, zdrojový kód je
      otvorený a verejne prístupný na GitHube: <br><br><a href="https://github.com/K0V0/BandzoneScraper">https://github.com/K0V0/BandzoneScraper</a><br><br>Funkcie
      a nastavenia môžu v budúcnosti pribudnúť.<br><br>O android aplikácií a pripravovaných
      funkciách zatiaľ v tomto portfóliu informácie udávať nebudem, aplikácia sa zatiaľ
      stále nachádza v rannom štádiu vývoja a momentálne na ňu nemám čas.<br><br><strong>UPDATE
      (február 2021):<br>&nbsp;<br></strong>O aplikácií sa viac môžete dozvedieť tu:
